<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StraNova Holdings, LLC</title>

<meta name="description" content="StraNova Holdings, LLC is a healthcare services and business development company focused on building, supporting, and developing organizations that strengthen healthcare delivery and operational excellence.">

<style>
:root{
    --ink:#0B1F35;
    --harbor:#1E3A5C;
    --parchment:#F3EFE5;
    --parchment-alt:#EAE3D2;
    --brass:#9C7C3E;
    --hairline:#D4CBB4;
    --ink-soft:#4A5568;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    font-size:18px;
    line-height:1.65;
}

.wrap{
    max-width:720px;
    margin:0 auto;
    padding:0 28px;
}

a{
    color:var(--harbor);
}

header.masthead{
    padding:88px 0 40px;
    text-align:center;
}

header.masthead img{
    width:220px;
    height:auto;
    margin-bottom:28px;
}

header.masthead h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2.5rem;
    margin:0 0 6px;
}

header.masthead p.tagline{
    font-family:'Fraunces', serif;
    font-style:italic;
    color:var(--harbor);
    margin:0;
}

.rule{
    width:64px;
    height:2px;
    background:var(--brass);
    margin:40px auto;
    border:none;
}

section{
    padding:20px 0 56px;
}

section h2{
    font-family:'Fraunces', serif;
    font-size:1.7rem;
    margin:0 0 22px;
}

section p{
    max-width:62ch;
}

.mission-mark{
    display:block;
    margin:0 auto 18px;
    width:34px;
}

.criteria-list{
    list-style:none;
    margin:28px 0 0;
    padding:0;
    border-top:1px solid var(--hairline);
}

.criteria-list li{
    padding:24px 0;
    border-bottom:1px solid var(--hairline);
    display:grid;
    grid-template-columns:180px 1fr;
    gap:22px;
}

.criteria-list h3{
    margin:0;
    font-family:'Fraunces', serif;
    font-size:1.05rem;
    color:var(--harbor);
}

.criteria-list p{
    margin:0;
    color:var(--ink-soft);
}

@media (max-width: 560px){
    .criteria-list li{
        grid-template-columns:1fr;
        gap:8px;
    }
}

#contact{
    background:var(--parchment-alt);
    margin:0 -28px;
    padding:56px 28px 64px;
}

#contact .wrap{
    max-width:600px;
    margin:0 auto;
}

form{
    display:grid;
    gap:18px;
    margin:28px auto 0;
    max-width:420px;
    width:100%;
}

label{
    display:block;
    margin-bottom:6px;
    font-family:'Fraunces', serif;
    color:var(--harbor);
}

input,
textarea{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--hairline);
    background:var(--parchment);
    font-family:'Source Serif 4', Georgia, serif;
    font-size:1rem;
}

textarea{
    min-height:140px;
    resize:vertical;
}

button.submit{
    justify-self:start;
    border:none;
    padding:13px 30px;
    background:var(--ink);
    color:var(--parchment);
    cursor:pointer;
    font-family:'Fraunces', serif;
    font-size:1rem;
}

button.submit:hover{
    background:var(--harbor);
}

footer{
    text-align:center;
    padding:40px 28px 60px;
    color:var(--ink-soft);
    font-size:.85rem;
}
</style>
</head>

    </div>
</header>
